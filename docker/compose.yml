name: foundry-cli

secrets:
  foundry_config_json:
    file: secrets.json

services:
  foundry:
    container_name: foundry-cli
    hostname: foundry-cli
    image: felddy/foundryvtt:release
    secrets:
      - source: foundry_config_json
        target: config.json
    ports:
      - 30001:30000
    volumes:
      - ./data:/data/
