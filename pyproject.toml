[project]
name = "foundry-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "python-socketio[client]>=5.0",
    "websocket-client>=1.0",
    "requests>=2.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "pillow>=13.0.0",
    "mflux==0.24.0 ; platform_machine == 'arm64' and sys_platform == 'darwin'",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
