[project]
name = "foundry-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "python-socketio[client]>=5.0",
    "websocket-client>=1.0",
    "requests>=2.0",
    "python-dotenv>=1.0",
    "mcp>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
